id: com.mateusf.CheckDNSBlock
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: check-dns-block

# Kept to the minimum the app actually needs - a DNS resolver (network) with
# a GUI window (Wayland/X11 + GPU). The save-file dialog and "open in
# browser" both go through XDG portals (see tauri-plugin-dialog/opener), so
# neither needs a static --filesystem permission.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: check-dns-block
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        # Must be exactly `<build-root>/cargo` - that's where
        # flatpak-cargo-generator's output places both `cargo/vendor/*` and
        # the `cargo/config.toml` that redirects crates.io to it (verified
        # locally: see docs/RELEASING.md).
        CARGO_HOME: /run/build/check-dns-block/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      # The sandbox has no network, so pnpm itself is vendored as a static
      # binary (it bundles its own JS runtime) instead of relying on a
      # package manager to install it.
      # --no-same-owner: the pnpm release tarball was built on macOS CI, so
      # its entries carry macOS ownership (uid 501/gid 20) that an
      # unprivileged `tar` inside the sandbox can't apply (fails every entry
      # with "Cannot change ownership ... Invalid argument").
      - mkdir -p pnpm-bin && tar --no-same-owner -xzf pnpm-linux-x64.tar.gz -C pnpm-bin && chmod +x pnpm-bin/pnpm
      # Populates a local pnpm content-addressable store from the tarballs
      # node-sources.json vendored, then points pnpm at it - this is
      # node-sources.json's own prescribed setup (printed by
      # flatpak-node-generator when run with `pnpm` as the package manager).
      - python3 flatpak-node/populate_pnpm_store.py flatpak-node/pnpm-manifest.json flatpak-node/pnpm-tarballs flatpak-node/pnpm-store
      # populate_pnpm_store.py indexes every package by the bare
      # `<integrity>\t<name>@<version>` pnpm uses for most packages - but
      # not for ones with peer dependencies pnpm actually resolves (here:
      # @cloudflare/kumo and ~20 React/Vite-ecosystem packages it pulls in).
      # For those, pnpm's real lookup key is the full peer-qualified
      # `snapshots:` entry from pnpm-lock.yaml, so without a matching index
      # row under THAT id, `pnpm install --offline` reports the package
      # "missing from the store" (confirmed via pnpm's own store/index
      # source - see the script for the full explanation).
      - python3 flatpak/populate_peer_snapshot_aliases.py pnpm-lock.yaml flatpak-node/pnpm-store
      # Since pnpm 11, .npmrc only reads auth/registry settings - storeDir
      # has to go in pnpm-workspace.yaml instead, or pnpm silently ignores
      # it and falls back to its (empty, in the sandbox) default store.
      # minimumReleaseAge also defaults to 1440 (minutes) since pnpm 11,
      # which makes pnpm check every package's publish time against the
      # registry regardless of --offline - disable it for this offline
      # build, since there's no registry to check against anyway and the
      # vendored sources already come from the committed, reviewed lockfile.
      - |
        printf 'storeDir: %s/flatpak-node/pnpm-store\nminimumReleaseAge: 0\n' "$PWD" >> pnpm-workspace.yaml
      - PATH="$PWD/pnpm-bin:$PATH" pnpm install --offline --frozen-lockfile
      - PATH="$PWD/pnpm-bin:$PATH" pnpm build
      # `--config` merges src-tauri/tauri.flatpak.conf.json over the normal
      # tauri.conf.json - it only overrides `identifier` and
      # `app.enableGTKAppId`, so GTK/Wayland see an app ID we can actually
      # register on Flathub (com.mateusf.CheckDNSBlock) without touching the
      # dev.mateusfg7.checkdnsblock identifier the Windows/macOS/other Linux
      # installers and existing users' app data rely on.
      - PATH="$PWD/pnpm-bin:$PATH" pnpm tauri build --no-bundle --config src-tauri/tauri.flatpak.conf.json
      - install -Dm755 src-tauri/target/release/check-dns-block /app/bin/check-dns-block
      - install -Dm644 flatpak/com.mateusf.CheckDNSBlock.desktop /app/share/applications/com.mateusf.CheckDNSBlock.desktop
      - install -Dm644 flatpak/com.mateusf.CheckDNSBlock.metainfo.xml /app/share/metainfo/com.mateusf.CheckDNSBlock.metainfo.xml
      - install -Dm644 src-tauri/app-icon.svg /app/share/icons/hicolor/scalable/apps/com.mateusf.CheckDNSBlock.svg
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.mateusf.CheckDNSBlock.png
      - install -Dm644 LICENSE /app/share/licenses/com.mateusf.CheckDNSBlock/LICENSE
    sources:
      - type: dir
        path: ..
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v11.13.0/pnpm-linux-x64.tar.gz
        sha256: 2c15f7b6ab256642f4d01687a2b01e07714d835d05d29ba045bdbde59b17bb4f
        dest-filename: pnpm-linux-x64.tar.gz
      # Generated by `pnpm flatpak:sources` (scripts/flatpak-sources.sh),
      # right before the build - not committed, see .gitignore.
      - generated-sources/cargo-sources.json
      - generated-sources/node-sources.json
