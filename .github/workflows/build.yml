# Proves the app compiles (`tauri build --debug --no-bundle`) on a platform.
# Nothing is published.
#
# macOS and Windows runners are billed at 10x and 2x the Linux rate, so they
# only run when asked for:
#   - every PR and push to main builds Linux only, called from ci.yml;
#   - every release bundles all three for real, in release.yml's `bundle` job;
#   - a manual run picks the platforms.
name: Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [linux, windows, macos, all]
        default: linux
  workflow_call:
    inputs:
      platforms:
        type: string
        default: linux

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Choose platforms
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          case "$PLATFORMS" in
            all)     m='["ubuntu-22.04","windows-latest","macos-latest"]' ;;
            windows) m='["windows-latest"]' ;;
            macos)   m='["macos-latest"]' ;;
            *)       m='["ubuntu-22.04"]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle
