name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Linux only: Windows/macOS builds run on release, or on demand via a
  # manual dispatch of build.yml.
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      platforms: linux

  flatpak-lint:
    name: Flatpak lint
    runs-on: ubuntu-22.04
    # Flathub's own linter, run as a container rather than via ubuntu-22.04's
    # `appstream` apt package (0.15.2): that version is old enough to reject
    # tags Flathub's actual (much newer) validator requires, like <developer
    # id="...">, which it needs for domain-ownership verification.
    container: ghcr.io/flathub/flatpak-builder-lint:latest
    steps:
      - uses: actions/checkout@v7
      - run: flatpak-builder-lint appstream flatpak/com.mateusf.CheckDNSBlock.metainfo.xml
      # Not `flatpak-builder-lint manifest` here: it resolves the manifest's
      # `generated-sources/*.json` module sources for real (via
      # libflatpak-builder), which only exist after `pnpm flatpak:sources`
      # runs - this job stays fast/network-light, so that check happens
      # where the sources actually get generated, in the `flatpak` release
      # job (a full `flatpak-builder` build there is a stronger check of the
      # manifest anyway).

  desktop-file-lint:
    name: Desktop file lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: desktop-file-validate flatpak/com.mateusf.CheckDNSBlock.desktop

  changeset:
    name: Changeset check
    # The "Version Packages" PR (opened by changesets/action from
    # changeset-release/main) consumes existing changesets and bumps
    # versions; it never adds a new changeset for its own diff, so it's
    # exempt from this check.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The changelog only covers changes to the app itself, so a PR that
      # touches nothing but repo tooling (CI, docs, release scripts, editor
      # and lint config) needs no changeset.
      - name: Check whether the app changed
        id: scope
        run: |
          app=$(git diff --name-only origin/main...HEAD | grep -vE \
            '^(\.github/|docs/|\.changeset/|\.vscode/|README\.md$|LICENSE$|renovate\.json$|biome\.json$|\.editorconfig$|\.gitignore$|scripts/(release-tag|sync-version)\.mjs$)' \
            || true)
          if [ -n "$app" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only repo tooling changed; no changeset needed."
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.required == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.scope.outputs.required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - if: steps.scope.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.required == 'true'
        run: pnpm changeset status --since=origin/main
