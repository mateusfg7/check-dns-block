[package]
name = "check-dns-block"
version = "0.4.4"
description = "Check DNS Block - checks whether domains/IPs are blocked on a given DNS server"
authors = ["Mateus Felipe Gonçalves"]
license = "MIT"
repository = "https://github.com/mateusfg7/check-dns-block"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "check_dns_block_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hickory-resolver = { version = "0.26", features = ["tokio"] }
futures = "0.3.34"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["clock"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
idna = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
